<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d12">
  <meta name="description" content="Penta is an in-browser creative studio by Mollemira Porphura.">
  <title>Penta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/gifuct-js/dist/gifuct.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
</head>
<!-- Penta's existing workspace markup is kept intact; implementation now lives in styles.css and app.js. -->
<body>

    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn mode-btn" id="antiAliasToggle" title="Antialiasing: ON (smooth)">
                    <span class="material-symbols-rounded">line_start_circle</span>
                </button>
                <button class="icon-btn mode-btn" id="pixelGridToggle" title="Pixel Grid">
                    <span class="material-symbols-rounded">grid_4x4</span>
                </button>
                <button class="icon-btn mode-btn" id="topUndo" title="Undo (Ctrl+Z)">
                    <span class="material-symbols-rounded">undo</span>
                </button>
                <button class="icon-btn mode-btn" id="topRedo" title="Redo (Ctrl+Y)">
                    <span class="material-symbols-rounded">redo</span>
                </button>
                <button class="icon-btn mode-btn" id="canvasSwitcherBtn" title="Canvases">
                    <span class="material-symbols-rounded">tab</span>
                </button>
            </div>

            <nav class="menubar topbar-center" id="mainMenu" aria-label="Penta menu bar">
                <div class="menu"><button>File</button>
                    <div class="menu-list">
                        <button data-action="new">New</button><button data-action="open">Open</button><button
                            data-action="save">Save</button><button data-action="saveAs">Save As
                            <small>export</small></button>
                        <div class="sep"></div><button data-action="print">Print</button>
                    </div>
                </div>
                <div class="menu"><button>Edit</button>
                    <div class="menu-list">
                        <button data-action="undo">Undo</button><button data-action="redo">Redo</button>
                        <div class="sep"></div><button data-action="cut">Cut</button><button
                            data-action="copy">Copy</button><button data-action="copyMerged">Copy Merged</button><button
                            data-action="paste">Paste</button><button data-action="pasteNewLayer">Paste into New
                            Layer</button>
                    </div>
                </div>
                <div class="menu"><button>Select</button>
                    <div class="menu-list">
                        <button data-action="selectAll">All</button><button
                            data-action="deselect">Deselect</button><button
                            data-action="reselect">Reselect</button><button
                            data-action="inverseSelection">Inverse</button>
                        <div class="sep"></div><button data-action="allLayers">All Layers</button><button
                            data-action="deselectLayers">Deselect Layers</button><button data-action="findLayers">Find
                            Layers</button><button data-action="growSelection">Increment</button><button
                            data-action="shrinkSelection">Decrement</button>
                    </div>
                </div>
                <div class="menu"><button>Image</button>
                    <div class="menu-list">
                        <button data-action="cropSelection">Crop to Selection</button><button
                            data-action="resizeImage">Resize</button><button data-action="canvasSize">Canvas
                            Size</button>
                        <div class="sep"></div><button data-action="imageFlipH">Flip Horizontal</button><button
                            data-action="imageFlipV">Flip Vertical</button><button data-action="imageRotate90CW">Rotate
                            90
                            Clockwise</button><button data-action="imageRotate90CCW">Rotate 90
                            Counter-Clockwise</button><button data-action="imageRotate180">Rotate 180</button>
                        <div class="sep"></div><button data-action="flatten">Flatten</button>
                    </div>
                </div>
                <div class="menu"><button>Layers</button>
                    <div class="menu-list">
                        <button data-action="addLayer">Add New Layer</button><button data-action="deleteLayer">Delete
                            Layer</button><button data-action="duplicateLayer">Duplicate Layer</button><button
                            data-action="mergeDown">Merge Layer Down</button><button
                            data-action="toggleLayerVisibility">Toggle Layer
                            Visibility</button><button data-action="clearLayer">Clear Active Layer</button><button
                            data-action="importLayer">Import From File</button>
                        <div class="sep"></div><button data-action="layerFlipH">Flip Horizontal</button><button
                            data-action="layerFlipV">Flip Vertical</button><button data-action="layerRotate180">Rotate
                            180</button><button data-action="layerRotateZoom">Rotate / Zoom</button>
                        <div class="sep"></div><button data-action="rasterizeLayer">Rasterize Vector
                            Layer</button><button data-action="strokesToVector">Selected Strokes to Vector</button>
                    </div>
                </div>
                <div class="menu"><button>Adjustments</button>
                    <div class="menu-list">
                        <button data-action="blackWhite">Black and White</button><button
                            data-action="brightnessContrast">Brightness
                            / Contrast</button><button data-action="exposure">Exposure</button><button
                            data-action="highlightsShadows">Highlights / Shadows</button><button
                            data-action="hueSaturation">Hue /
                            Saturation</button><button data-action="invertAlpha">Invert Alpha</button><button
                            data-action="invertColors">Invert Colors</button>
                    </div>
                </div>
                <div class="menu"><button>View</button>
                    <div class="menu-list">
                        <button data-action="zoomIn">Zoom In</button><button data-action="zoomOut">Zoom
                            Out</button><button data-action="zoomWindow">Zoom to Window</button><button
                            data-action="zoomSelection">Zoom to Selection</button><button data-action="togglePixelGrid">Pixel Grid
                            <small>500%+</small></button><button data-action="togglePixelView">Pixel View</button>
                    </div>
                </div>
                <div class="menu"><button>Help</button>
                    <div class="menu-list">
                        <button data-action="help">Help</button><button data-action="settings">Settings</button>
                    </div>
                </div>
            </nav>
            <div class="topbar-right">
                <div class="status status-pill" id="statusLine" title="Hover for color workflow"></div>
            </div>
        </header>

        <aside class="panel left">
            <section class="section">
                <h2>Tool Dock</h2>
                <div class="tool-row" id="tools">
                    <button class="tool-btn active" data-tool="brush" title="Brush (B)"><span
                            class="material-symbols-rounded">brush</span></button>
                    <button class="tool-btn" data-tool="pencil" title="Pencil / 1 Pixel Tool"><span
                            class="material-symbols-rounded">edit</span></button>
                    <button class="tool-btn" data-tool="eraser" title="Eraser (E)"><span
                            class="material-symbols-rounded">ink_eraser</span></button>
                    <button class="tool-btn tool-family" data-family="shape" id="shapeToolBtn" title="Shapes"><span
                            class="material-symbols-rounded">rectangle</span></button>
                    <button class="tool-btn" data-tool="fill" title="Bucket Fill (G)"><span
                            class="material-symbols-rounded">format_color_fill</span></button>
                    <button class="tool-btn" data-tool="line" title="Line"><span
                            class="material-symbols-rounded">pen_size_2</span></button>
                    <button class="tool-btn tool-family" data-family="selection" id="selectionToolBtn"
                        title="Selection Tools"><span class="material-symbols-rounded">select</span></button>
                    <button class="tool-btn tool-family" data-family="move" id="moveToolBtn" title="Move Tools"><span
                            class="material-symbols-rounded">open_with</span></button>
                    <button class="tool-btn" data-tool="text" title="Text Tool (T)"><span
                            class="material-symbols-rounded">text_fields</span></button>
                    <button class="tool-btn" data-tool="strokePick" title="Pick Stroke for Revision"><span
                            class="material-symbols-rounded">edit_note</span></button>
                    <button class="tool-btn" data-tool="pan" title="Pan (Space)"><span
                            class="material-symbols-rounded">pan_tool</span></button>
                    <button class="tool-btn" data-tool="zoom" title="Zoom"><span
                            class="material-symbols-rounded">zoom_in</span></button>
                </div>

                <div class="section alt-tools-section" id="altToolsSection" style="display:none">
                    <h2>Alt</h2>
                    <div class="tool-row" id="altTools"></div>
                </div>
                <div class="section alt-tools-section" id="modeToolsSection" style="display:none">
                    <h2>Mode</h2>
                    <div class="tool-row" id="modeTools"></div>
                </div>
            </section>

            <section class="section">
                <h2>Brush Options</h2>
                <div class="field dual-color-line">
                    <div class="color-pair">
                        <input type="color" id="color" value="#d70040" title="Primary color">
                        <input type="color" id="color2" value="#38d5ff" title="Secondary color">
                    </div>
                    <input type="text" id="colorText" value="#d70040" title="Primary hex">
                    <input type="text" id="colorText2" value="#38d5ff" title="Secondary hex">
                </div>
                <div class="field"><label>Size <output id="sizeOut">18</output></label><input type="range" id="size"
                        min="1" max="160" value="18"></div>
                <div class="field"><label>Opacity <output id="opacityOut">100%</output></label><input type="range"
                        id="opacity" min="1" max="100" value="100"></div>
                <div class="field"><label>Softness <output id="softOut">0%</output></label><input type="range"
                        id="softness" min="0" max="100" value="0"></div>
                <div class="field"><label>Stabilizer <output id="stabOut">0%</output></label><input type="range"
                        id="stabilizer" min="0" max="100" value="0"></div>
                <div class="field brush-advanced"><label>Mouse pressure emulation</label><select id="mousePressureEnabled">
                        <option value="off">Off</option>
                        <option value="on">On</option>
                    </select></div>
                <div class="field brush-advanced"><label>Blend mode</label><select id="blend">
                        <option>source-over</option>
                        <option>multiply</option>
                        <option>screen</option>
                        <option>overlay</option>
                        <option>lighter</option>
                        <option>color-dodge</option>
                        <option>color-burn</option>
                    </select></div>
                <div class="field brush-advanced"><label>Text size</label><input type="number" id="textSize" value="42" min="6"
                        max="400">
                </div>
            </section>

        </aside>

        <main class="workspace" id="workspace">
            <div class="canvas-stage" id="stage">
                <div class="canvas-shell" id="canvasShell">
                    <canvas id="compositeCanvas"></canvas>
                    <canvas id="previewCanvas"></canvas>
                    <div id="cursorPreview"></div>
                    <div id="selectionBox" class="selection-box"></div>
                    <div id="textEditor" class="text-editor" contenteditable="true"></div>
                </div>
            </div>
            <canvas id="pixelGridOverlay"></canvas>
            <canvas id="uiOverlayCanvas"></canvas>
        </main>

        <aside class="panel right" id="layerDock">
            <section class="section">
                <h2>Layer Dock</h2>
                <div class="tool-row">
                    <button class="btn" id="addLayer"><span class="material-symbols-rounded">add</span>Raster</button>
                    <button class="btn" id="addVectorLayer"><span
                            class="material-symbols-rounded">polyline</span>Vector</button>
                    <button class="btn" id="dupLayer"><span
                            class="material-symbols-rounded">content_copy</span>Duplicate</button>
                    <button class="btn danger" id="delLayer"><span
                            class="material-symbols-rounded">delete</span></button>
                </div>
                <div class="field"><label>Active layer opacity <output id="layerOpacityOut">100%</output></label><input
                        type="range" id="layerOpacity" min="0" max="100" value="100"></div>
                <div class="layer-list" id="layerList"></div>
            </section>
        </aside>
        <button class="layer-dock-toggle" id="layerDockToggle" title="Collapse layer dock"
            aria-label="Collapse layer dock" aria-expanded="true">
            <span class="material-symbols-rounded">chevron_forward</span>
        </button>

        <input type="hidden" id="cw" value="1280">
        <input type="hidden" id="ch" value="720">

        <footer class="timeline" id="bottomDock">
            <button class="icon-btn dock-compact-toggle" id="bottomDockCompactToggle" title="Collapse bottom dock"
                aria-label="Collapse bottom dock" aria-pressed="false"><span class="material-symbols-rounded">chevron_left</span></button>
            <div class="dock-launchers" id="dockLaunchers">
            </div>
            <div id="dockContent"></div>
        </footer>
    </div>

    <input class="hidden-file" type="file" id="projectInput"
        accept=".penta,application/json,image/png,image/jpeg,image/gif" />
    <input class="hidden-file" type="file" id="imageInput" accept="image/png,image/jpeg,image/gif" />
    <input class="hidden-file" type="file" id="brushTextureInput" accept="image/png,image/jpeg,image/webp" />
    <input class="hidden-file" type="file" id="brushPresetInput" accept=".pbrush,application/json" />
    <div class="toast" id="toast"></div>


<script src="app.js"></script>
</body>
</html>
