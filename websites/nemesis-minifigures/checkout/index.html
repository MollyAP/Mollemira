<body data-page="checkout">
    <div class="top-strip"></div>
    <header class="site-header">
        <div class="nav-shell">
            <nav class="nav-left"><a class="nav-link" href="./">Home</a><a class="nav-link" href="catalog/">Minifigures</a><a class="nav-link" href="about/">About</a></nav>

            <div class="nav-right"><a class="nav-link" href="orders/">Orders</a><a class="nav-link" href="preorders/">Preorders</a><a class="nav-link" href="updates/">Updates</a><a class="admin-avatar-link admin-nav-link hidden" href="admin/panel" aria-label="Admin account"></a><a class="nav-link cart-icon-link" href="checkout/" aria-label="Cart"><span class="material-symbols-outlined">shopping_cart</span><span class="cart-count-badge" data-cart-count></span></a></div>

        </div>
    </header>
    <main class="form-shell checkout-shell">
        <div class="form-panel">
            <h1>Checkout</h1>
            <div id="checkoutSummary"></div>
            <p id="checkoutNotice" class="notice">Review your order, then continue to secure payment.</p>
            <form id="checkoutForm" class="form-grid">
                <label>Name <input id="checkoutName" class="field" required autocomplete="name"></label>
                <label>Email <input id="checkoutEmail" class="field" type="email" required autocomplete="email"></label>
                <label>Shipping Address <textarea id="checkoutAddress" required autocomplete="shipping street-address"></textarea></label>
                <label>Country <input id="checkoutCountry" class="field" value="United States" required autocomplete="shipping country"></label>
                <div id="stripeCheckoutMount" class="stripe-checkout-mount"></div>
                <button class="btn primary" type="submit">Proceed To Checkout</button>
            </form>
        </div>
    </main>
    <script src="https://js.stripe.com/v3/"></script>
